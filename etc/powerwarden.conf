# match (substr of exec path)   cpu%   watts   action
# cpu% = % of one core, sum over all procs matching; '-' = no limit
# action: stop = SIGSTOP/SIGCONT duty cycle, bg = DARWIN_BG (E-cores), nice = nice 20
"Slack.app"                      30     1.5     stop
"Discord.app"                    40     -       bg
"Microsoft Teams.app"            50     2.0     stop
